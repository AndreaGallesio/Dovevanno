<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#07081a">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dove Vanno</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
:root{--bg:#07081a;--card:rgba(255,255,255,.06);--ink:#f2f3ff;--mute:#9aa0c8;--line:rgba(255,255,255,.1);--acc:#8b6dff;--onacc:#fff;--accsoft:rgba(139,109,255,.2);--hero:linear-gradient(140deg,#5a35ee,#2c33c9 58%,#1a1f80);--warn:#f0b840;--warnsoft:rgba(240,184,64,.16);--ease:cubic-bezier(.2,.7,.2,1);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:22px 16px 48px}
h1.brand{display:flex;align-items:center;gap:12px;font-size:32px;line-height:1;margin:6px 0 10px;font-weight:800;letter-spacing:-.03em}
.logo{width:40px;height:40px;flex:none}
.logo rect{transform-box:fill-box;transform-origin:left center;animation:growx .7s var(--ease) both}
.logo .b2{animation-delay:.12s}.logo .b3{animation-delay:.24s}
h2{font-size:19px;margin:30px 0 10px;font-weight:700;letter-spacing:-.01em}
p{margin:0 0 12px}
.mute{color:var(--mute);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 10px 40px -16px rgba(0,0,0,.6)}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(90px);z-index:-1;pointer-events:none;animation:drift 20s ease-in-out infinite alternate}
body::before{width:380px;height:380px;background:var(--acc);opacity:.16;top:-120px;right:-120px}
body::after{width:340px;height:340px;background:#2d6bff;opacity:.16;bottom:-120px;left:-120px;animation-duration:26s}
.drop{display:flex;align-items:center;justify-content:center;gap:12px;border:2px dashed var(--acc);border-radius:20px;padding:18px 14px;font-weight:700;color:var(--acc);cursor:pointer;background:var(--card);transition:transform .25s var(--ease),background .25s}
.drop:hover{background:var(--accsoft);transform:translateY(-2px)}
.drop:active{transform:scale(.98)}
.drop svg{width:26px;height:26px;flex:none}
.drop input{display:none}
button{font:inherit;font-weight:700;border:0;border-radius:99px;padding:10px 18px;background:var(--acc);color:var(--onacc);cursor:pointer;transition:transform .2s var(--ease),opacity .2s,background .2s}
button:active{transform:scale(.95)}
button.ghost{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
button:disabled{opacity:.5}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin:12px -16px 0;padding:12px 16px 10px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 78%,transparent)}
.chip{flex:none;background:var(--card);color:var(--ink);border:1px solid var(--line);padding:8px 16px;font-weight:600}
.chip.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,rgba(124,92,255,.34),rgba(18,16,58,.78) 70%);color:#fff;border:1px solid rgba(160,140,255,.5);border-radius:30px;padding:22px;box-shadow:0 0 44px -12px rgba(124,92,255,.7)}
.hin svg{width:120px;height:120px;flex:none}.hin>div:last-child{min-width:0}
.hin{position:relative;z-index:1}
.orb{position:absolute;border-radius:50%;filter:blur(34px);opacity:.55;pointer-events:none}
.o1{width:170px;height:170px;background:#7c6cff;right:-40px;top:-50px}
.o2{width:150px;height:150px;background:#2d9cff;left:30%;bottom:-70px}
.hero .mute{color:rgba(255,255,255,.75)}
.hero .big{font-size:clamp(28px,8.6vw,40px);white-space:nowrap;font-weight:800;line-height:1.05;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:2px 0}
.row{display:grid;grid-template-columns:auto 1fr auto auto;gap:4px 10px;align-items:center;padding:11px 8px;margin:0 -8px;width:calc(100% + 16px);background:none;color:var(--ink);border-radius:14px;text-align:left;font-weight:400;transition:background .2s}
.row:hover{background:var(--accsoft)}
.row b{font-weight:600}
.dot{width:12px;height:12px;border-radius:50%}
.rbar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--accsoft);overflow:hidden}
.rbar i{display:block;height:100%;border-radius:3px}
.num{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.tot{display:flex;justify-content:space-between;padding-top:14px;font-weight:800;font-size:18px}
.q{display:grid;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.q .top{display:flex;justify-content:space-between;gap:10px}
select{font:inherit;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--warnsoft);color:var(--warn);margin-left:6px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.err{color:var(--warn);font-size:14px;margin-top:8px}
.ok{color:var(--acc);font-size:14px;margin-top:8px;font-weight:600;animation:fadeup .4s var(--ease)}
.tx{display:grid;grid-template-columns:52px 1fr auto;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.tx:last-child{border-bottom:0}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px}
svg text{font-family:inherit}
.hero::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.12) 50%,transparent 65%);transform:translateX(-100%);animation:sheen 7s ease-in-out infinite}
.drop.mini{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:20;border:0;border-radius:99px;padding:15px 22px;background:var(--acc);color:var(--onacc);box-shadow:0 14px 34px -8px rgba(75,59,227,.7)}
.drop.mini:hover{background:var(--acc)}
.drop.mini svg{width:22px;height:22px}
.ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center}
.ic svg{width:20px;height:20px}
.row.soft{opacity:.6}
#scrim{position:fixed;inset:0;z-index:25;background:rgba(8,6,30,.55);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
#detail{position:fixed;left:0;right:0;bottom:0;max-height:90vh;overflow-y:auto;z-index:30;background:rgba(12,13,36,.86);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border-top:1px solid var(--line);border-radius:30px 30px 0 0;padding:10px 16px calc(28px + env(safe-area-inset-bottom,0px));box-shadow:0 -24px 60px rgba(0,0,0,.4)}
#detail>*{max-width:528px;margin-left:auto;margin-right:auto}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 6px!important}
input{font:inherit;width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink)}
select{background:rgba(255,255,255,.05)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.fgrid>*{min-width:0}.w2{grid-column:1/-1}
.fl{display:grid;gap:4px;font-size:12px;color:var(--mute);font-weight:600}
input[type=date]{-webkit-appearance:none;appearance:none;min-height:46px;display:block;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.tx2{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.tx2:last-child{border-bottom:0}
.pos{color:#4ade80}
.pill{display:inline-block;margin-top:8px;padding:3px 11px;border-radius:99px;background:rgba(255,255,255,.18);font-size:13px;font-weight:700}
.bbar{height:10px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:12px}
.bbar i{display:block;height:100%;border-radius:5px}
.seg:hover{filter:brightness(1.25)}
.hero .big{font-size:clamp(34px,11.5vw,52px);background:linear-gradient(90deg,#fff,#c9bcff);-webkit-background-clip:text;background-clip:text;color:transparent;margin:4px 0 8px}
.mrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}.mrow .pill{margin:0}
.hbtns{display:flex;gap:10px;margin-top:18px}
.gbtn{flex:1;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:18px;padding:13px 8px;font-weight:700;font-size:15px;white-space:nowrap}
.drop.mini{display:none}
.glow{border-color:rgba(139,109,255,.45);box-shadow:0 0 34px -12px rgba(139,109,255,.55)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.st{min-width:0;padding:12px;border-radius:20px;background:linear-gradient(165deg,color-mix(in srgb,var(--c) 24%,transparent),rgba(255,255,255,.03) 72%);border:1px solid color-mix(in srgb,var(--c) 50%,transparent);box-shadow:0 0 26px -10px var(--c)}
.st .mute{font-size:13px}
.sic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c);margin-bottom:10px}
.sic svg{width:19px;height:19px}
.sv{font-size:16px;font-weight:800;color:var(--c);font-variant-numeric:tabular-nums;white-space:nowrap}
.brkbody{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:8px}
.brkbody>div:first-child{min-width:0}
.lg{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;width:100%;background:none;color:var(--ink);border-radius:10px;padding:7px 4px;font-weight:500;font-size:14px;text-align:left}
.ln{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dn svg{width:150px;height:150px;display:block}
.goal{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;cursor:pointer}
.gico{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--accsoft);color:var(--acc)}
.gico svg{width:24px;height:24px}
.gp{font-size:24px;font-weight:800;text-align:right}
.lgr{display:flex;gap:14px;justify-content:center;margin-top:8px}
.lgm{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.lgm i{width:10px;height:10px;border-radius:3px}
#mform{position:fixed;left:0;right:0;bottom:0;z-index:40;max-height:92vh;overflow-y:auto;background:rgba(12,13,36,.95);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border-top:1px solid var(--line);border-radius:30px 30px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 -24px 60px rgba(0,0,0,.4)}
#mform>*{max-width:528px;margin:0 auto 12px}
#mform .fl{display:grid}
.seg2{display:flex;gap:8px}.seg2 .chip{flex:1}
.xbtn{background:none;color:var(--mute);min-width:40px;min-height:40px;padding:6px;display:grid;place-items:center;border-radius:12px}
.xbtn svg{width:20px;height:20px}
.xbtn.armed{background:#ff5d73;color:#fff;font-size:13px;font-weight:700;padding:8px 14px;border-radius:99px}
.seg3{display:flex;gap:4px;padding:4px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid var(--line);margin:14px 0 10px}
.sg{flex:1;background:none;color:var(--mute);padding:9px 0;font-weight:700;border-radius:99px;font-size:14px}
.sg.on{background:var(--acc);color:var(--onacc)}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:8px;margin:0 -16px 12px;padding:6px 16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 78%,transparent)}
.na{width:46px;height:46px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--ink);font-size:26px;line-height:1;padding:0;display:grid;place-items:center;flex:none}
.na:disabled{opacity:.3}
.nl{position:relative;flex:1;height:46px;border-radius:99px;background:var(--card);border:1px solid var(--line);display:flex;justify-content:center;align-items:center;gap:8px;font-size:19px;font-weight:800;letter-spacing:-.01em;overflow:hidden}
.chev{font-size:11px;color:var(--mute)}
.ghostsel{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0}
#srcs .sg{font-size:13px}
@keyframes sheen{60%,100%{transform:translateX(100%)}}
@keyframes drift{to{transform:translate(-50px,60px) scale(1.15)}}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.97)}}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}}
@keyframes draw{from{stroke-dasharray:0 314.16}}
@keyframes growy{from{transform:scaleY(0)}}
@keyframes growx{from{transform:scaleX(0)}}
@keyframes grow{from{width:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1 class="brand"><svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="13" fill="#7c5cff"/><rect class="b1" x="10" y="11" width="20" height="4.5" rx="2.25" fill="#fff"/><rect class="b2" x="10" y="18" width="14" height="4.5" rx="2.25" fill="#fff"/><rect class="b3" x="10" y="25" width="8" height="4.5" rx="2.25" fill="#fff"/></svg>Dove Vanno</h1>
<div class="seg3" id="srcs" role="group" aria-label="Conto"></div>
<p class="mute" id="intro">Carico i tuoi dati…</p>
<label class="drop" id="drop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg><span>Aggiungi un export di Satispay (.xlsx)</span><input type="file" id="file" accept=".xlsx,.xls,.csv"></label>
<button id="addm0" class="ghost" type="button" style="margin-top:10px;width:100%">+ Aggiungi una spesa a mano</button>
<div class="ok" id="msg" hidden></div>
<div class="err" id="err" hidden></div>

<section id="result" hidden>
  <div class="seg3" id="seg3" role="group" aria-label="Tipo di periodo"></div>
  <div class="nav" id="nav"></div>
  <div class="card hero" id="hero"><i class="orb o1"></i><i class="orb o2"></i><div class="hin" id="heroIn"></div></div>
  <div class="stats" id="stats"></div>
  <div class="card glow" id="brk" style="margin-top:12px"></div>
  <h2 id="lnT">Andamento nel mese</h2><div class="card" id="lnc"></div>
  <h2>Per categoria</h2>
  <p class="mute">Tocca una categoria per vedere i singoli pagamenti.</p>
  <div class="card" id="table"></div>
  <h2>Pagamenti</h2>
  <div class="card" id="srch">
    <input id="q" type="search" placeholder="Cerca un pagamento…" aria-label="Cerca">
    <div class="fgrid"><select id="fc" class="w2" aria-label="Categoria"><option value="">Tutte le categorie</option></select><input id="fmin" class="w2" type="number" inputmode="decimal" placeholder="Importo minimo €" aria-label="Importo minimo"><label class="fl">Dal<input id="fd1" type="date"></label><label class="fl">Al<input id="fd2" type="date"></label></div>
    <div class="mute" id="fsum"></div><div id="flist"></div>
  </div>
  <section id="detail" hidden></section>
  <section id="todo" hidden>
    <h2>Esercenti da confermare</h2>
    <p class="mute">Non li conosco ancora. Scegli la categoria: una volta confermata, la ricordo per i prossimi mesi.</p>
    <div class="card" id="unknown"></div>
    <div class="actions">
      <button id="save" type="button">Conferma scelte</button>
    </div>
  </section>
</section>
</main>

<div id="scrim" hidden></div>
<div id="mform" hidden role="dialog" aria-label="Nuova spesa">
  <div class="grab"></div>
  <h2 style="margin:6px auto 12px">Nuova spesa</h2>
  <div class="seg2"><button type="button" id="mOut" class="chip on">Uscita</button><button type="button" id="mIn" class="chip">Entrata</button></div>
  <label class="fl">Importo (€)<input id="mAmt" type="text" inputmode="decimal" autocomplete="off" placeholder="0,00"></label>
  <label class="fl">Descrizione<input id="mName" type="text" placeholder="Es. Pizzeria"></label>
  <label class="fl">Conto<select id="mSrc"><option value="contanti">Contanti</option><option value="satispay">Satispay</option></select></label>
  <label class="fl">Categoria<select id="mCat"></select></label>
  <label class="fl">Data<input id="mDate" type="date"></label>
  <div class="err" id="mErr" hidden></div>
  <div class="actions"><button id="mSave" type="button">Salva</button><button id="mCancel" class="ghost" type="button">Annulla</button></div>
</div>
<script>
const CATS=["Bar e caffè","Ristoranti e cibo","Tabacchi","Spesa","Trasporti","Shopping","Persone","Risparmi e investimenti","Ricariche e banca","Altro"];
const COL=["#7c6cff","#ff8a3d","#12b5a5","#f0477a","#2d9cff","#ffc233","#9bdc4d","#6f6c92","#5a5778","#b65cf5"];
const NONSPEND=["Risparmi e investimenti","Ricariche e banca"];
const IC={"Bar e caffè":"M17 8h1a4 4 0 0 1 0 8h-1M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4ZM6 2v3M10 2v3M14 2v3","Ristoranti e cibo":"M3 2v7a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6a2 2 0 0 0 2 2h3Zm0 0v7","Tabacchi":"M2 14h14v4H2zM20 14v4M18 10c0-2 2-2 2-5","Spesa":"M3 4h2l2.4 10.2a2 2 0 0 0 2 1.5h7.7a2 2 0 0 0 2-1.5L21 8H6M9 20h.01M18 20h.01","Trasporti":"M5 17h14M6 17V8a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3v9M8 21v-4M16 21v-4M9 12h6","Shopping":"M6 7h12l1 13H5ZM9 7a3 3 0 0 1 6 0","Persone":"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8","Risparmi e investimenti":"M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18M8 12h6M9 9.5a3.5 3.5 0 0 1 5-1M9 14.5a3.5 3.5 0 0 0 5 1","Ricariche e banca":"M3 10l9-6 9 6M5 10v8M9 10v8M15 10v8M19 10v8M3 21h18","Altro":"M5 12h.01M12 12h.01M19 12h.01"};
function ico(c){
  const k=IC[c]?c:"Altro",color=c==="Da confermare"?"#b9a36a":col(c);
  const e=h("span",{class:"ic",style:"color:"+color+";background:"+color+"26"});
  e.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+IC[k]+'"/></svg>';
  return e;
}
const col=c=>COL[Math.max(0,CATS.indexOf(c))];
const SEED={"Caffè Portici":"Bar e caffè","SumUp  *Cafe Noir":"Bar e caffè","AvGvstA":"Bar e caffè","KOMOREBI IMMOBILIARE S":"Bar e caffè","SUSHI STAR SRL":"Ristoranti e cibo","I Particular Osteria":"Ristoranti e cibo","MC DONALD'S":"Ristoranti e cibo","Qualeaty":"Ristoranti e cibo","Tabaccheria Calandri Domenica":"Tabacchi"};
const $=id=>document.getElementById(id);
const eur=n=>n.toLocaleString("it-IT",{style:"currency",currency:"EUR"});
const eur0=n=>n.toLocaleString("it-IT",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const norm=s=>String(s==null?"":s).trim();
const h=(t,a={},...c)=>{const e=document.createElement(t);for(const[k,v]of Object.entries(a)){if(k==="class")e.className=v;else if(k.startsWith("on"))e[k]=v;else e.setAttribute(k,v)}for(const x of c.flat())if(x!=null)e.append(x.nodeType?x:document.createTextNode(x));return e};
const mLabel=m=>{if(m[0]==="y")return "Anno "+m.slice(1);const[y,mo]=m.split("-");return new Date(+y,+mo-1,1).toLocaleDateString("it-IT",{month:"long",year:"numeric"})};
const mShort=m=>{const[y,mo]=m.split("-");return new Date(+y,+mo-1,1).toLocaleDateString("it-IT",{month:"short"}).replace(".","")};

let tx=new Map(),learned={},store=null,period="all",open=null,pending={},aiSet=new Set();

async function persist(months){

/* ---- categorie ---- */
function byTipo(t){
  if(/Persona/i.test(t))return "Persone";
  if(/Investimento/i.test(t))return "Risparmi e investimenti";
  if(/Deposito Risparmi/i.test(t))return "Altro";
  if(/Banca|Bonifico/i.test(t))return "Ricariche e banca";
  return null;
}
function categoria(t){
  return t.c||learned[t.n]||SEED[t.n]||(/Salvadanaio/i.test(t.n)?"Risparmi e investimenti":null)||byTipo(t.t)||null;
}

/* ---- lettura file ---- */
const pad=n=>String(n).padStart(2,"0");
function fmtDate(v){
  if(v instanceof Date)return v.getFullYear()+"-"+pad(v.getMonth()+1)+"-"+pad(v.getDate())+" "+pad(v.getHours())+":"+pad(v.getMinutes());
  return String(v).replace("T"," ").slice(0,16);
}
function parse(wb){
  const ws=wb.Sheets["Transactions"]||wb.Sheets[wb.SheetNames[0]];
  const out=[];
  for(const d of XLSX.utils.sheet_to_json(ws,{defval:null,raw:true})){
    const i=Number(d["Importo"]);
    if(!isFinite(i)||d["Nome"]==null||d["Data"]==null)continue;
    if(d["Stato"]&&/Annullato|corso/i.test(String(d["Stato"])))continue;
    const idk=Object.keys(d).find(k=>k.startsWith("ID"));
    const dt=fmtDate(d["Data"]);
    const n=norm(d["Nome"]);
    out.push({id:idk&&d[idk]?String(d[idk]):dt+"|"+n+"|"+i,d:dt,n,i,t:norm(d["Tipo"])});
  }
  return out;
}
async function load(file){
  showErr("");$("msg").hidden=true;
  try{
    const wb=XLSX.read(await file.arrayBuffer(),{type:"array",cellDates:true});
    const rows=parse(wb);
    if(!rows.length)throw new Error("Non trovo movimenti nel file. Serve l’export di Satispay con le colonne Nome, Importo e Tipo.");
    let add=0,dup=0;const months=new Set();
    for(const r of rows){if(tx.has(r.id)){dup++;continue}tx.set(r.id,r);months.add(r.d.slice(0,7));add++}
    await persist(months);
    const m=$("msg");m.textContent=add+" movimenti aggiunti"+(dup?", "+dup+" già presenti":"")+".";m.hidden=false;
    if(add){const ms=[...months].sort();period=ms[ms.length-1]}
    open=null;render();
    if(window.gsap&&!RM)gsap.fromTo("#hero",{scale:.96},{scale:1,duration:.9,ease:"elastic.out(1,.45)"});
  }catch(e){showErr(e.message||"Non riesco a leggere il file.")}
  $("file").value="";
}

function donut(tot,all){

  let a0=-Math.PI/2;

  for(const[c,v]of tot){
    const sw=v/all*2*Math.PI,gap=tot.length>1?.04:0,st=a0+gap/2,en=a0+sw-gap/2,color=c==="Da confermare"?"#b9a36a":col(c);
    const at='class="seg" data-c="'+c+'" pathLength="100" fill="none" stroke="'+color+'" stroke-width="22" style="cursor:pointer;stroke-dasharray:100"';
    if(sw>6.28)s+='<circle '+at+' cx="70" cy="70" r="50"/>';
    else if(en>st)s+='<path '+at+' d="M'+P(st)+"A"+R+","+R+" 0 "+(en-st>Math.PI?1:0)+" 1 "+P(en)+'"/>';
    a0+=sw;

}
function bars(catFilter){

  const m=$("msg");m.textContent="Spesa aggiunta.";m.hidden=false;
}
function renderTx(){
  const q=norm($("q").value).toLowerCase(),fc=$("fc").value,min=parseFloat($("fmin").value)||0,d1=$("fd1").value,d2=$("fd2").value;
  const rows=T().filter(inPeriod).filter(t=>{
    const c=categoria(t)||"Da confermare";
    if(q&&!(t.n.toLowerCase().includes(q)||c.toLowerCase().includes(q)))return false;
    if(fc&&c!==fc)return false;
    if(min&&Math.abs(t.i)<min)return false;
    const d=t.d.slice(0,10);
    return !(d1&&d<d1)&&!(d2&&d>d2);
  }).sort((a,b)=>b.d.localeCompare(a.d));
  $("fsum").textContent=rows.length+" pagamenti · saldo "+eur(rows.reduce((a,t)=>a+t.i,0));
  const box=$("flist");box.textContent="";
  for(const t of rows.slice(0,50)){
    const c=categoria(t)||"Da confermare",[,m,d]=t.d.slice(0,10).split("-");
    const man=String(t.id).startsWith("man-");
    const row=h("div",{class:"tx2"},ico(c),h("div",{},h("div",{},t.n),h("div",{class:"mute"},d+"/"+m+" · "+c+(src==="tot"?" · "+SRCN[srcOf(t)]:"")+(man?" · manuale":""))),h("span",{class:"num"+(t.i>0?" pos":"")},eur(t.i)));
    if(man){row.style.gridTemplateColumns="auto 1fr auto auto";row.append(delBtn(t))}
    box.append(row);
  }
  if(rows.length>50)box.append(h("p",{class:"mute"},"Mostro i primi 50: affina la ricerca."));
}
function renderDetail(cur){
  const box=$("detail");box.textContent="";
  const was=sheetOpen;sheetOpen=!!open;
  box.hidden=!open;$("scrim").hidden=!open;document.body.style.overflow=open?"hidden":"";
  if(!open)return;
  const rows=cur.filter(t=>categoria(t)===open).sort((a,b)=>b.d.localeCompare(a.d));
  const sum=rows.reduce((a,t)=>a+(t.i<0?-t.i:0),0);
  const g={};for(const t of rows)(g[t.n]=g[t.n]||{s:0,n:0}),g[t.n].s+=t.i,g[t.n].n++;
  box.append(h("h2",{},open),h("div",{class:"card"},
    h("div",{class:"head"},h("div",{},h("div",{class:"big",style:"font-size:24px;font-weight:800"},eur(sum)),h("div",{class:"mute"},rows.length+" movimenti"+(period==="all"?"":" in "+mLabel(period)))),h("button",{class:"ghost",type:"button",onclick:closeSheet},"Chiudi"))));
  const b=bars(open);
  if(b){const c=h("div",{class:"card",style:"margin-top:10px"});c.innerHTML=b;c.addEventListener("click",e=>{const x=e.target.closest("[data-m]");if(x){period=period===x.dataset.m?"all":x.dataset.m;render()}});box.append(c)}
  const mc=h("div",{class:"card",style:"margin-top:10px"});
  mc.append(h("b",{},"Per esercente"));
  for(const[n,v]of Object.entries(g).sort((a,b)=>Math.abs(b[1].s)-Math.abs(a[1].s))){
    const sel=h("select",{"aria-label":"Sposta "+n+" in un’altra categoria"});
    for(const c of CATS)sel.add(new Option(c,c));sel.value=open;
    sel.onchange=async()=>{learned[n]=sel.value;await persistRules();render()};
    mc.append(h("div",{class:"q"},h("div",{class:"top"},h("span",{},n+" ("+v.n+")"),h("span",{class:"num"},eur(-v.s))),sel));
  }
  box.append(mc);
  const lc=h("div",{class:"card",style:"margin-top:10px"});
  lc.append(h("b",{},"Pagamenti"),h("div",{class:"mute"},"Tocca un pagamento per modificarlo."));
  for(const t of rows.slice(0,60)){
    const [y,m,d]=t.d.slice(0,10).split("-");
    const r=h("div",{class:"tx"},h("span",{class:"mute"},d+"/"+m),h("span",{},t.n),h("span",{class:"num"},eur(t.i)));
    if(String(t.id).startsWith("man-")){r.style.gridTemplateColumns="52px 1fr auto auto";r.append(delBtn(t))}
    lc.append(r);
  }
  if(rows.length>60)lc.append(h("p",{class:"mute"},"Mostro i 60 più recenti."));
  box.append(lc);
  box.prepend(h("div",{class:"grab"}));
  if(window.gsap&&!RM&&!was){
    gsap.fromTo("#detail",{yPercent:100},{yPercent:0,duration:.6,ease:"power4.out"});
    gsap.fromTo("#scrim",{opacity:0},{opacity:1,duration:.4});
    gsap.from("#detail > *",{y:24,opacity:0,duration:.6,stagger:.08,ease:"power3.out",delay:.15});
    if(document.querySelector("#detail .gb"))gsap.from("#detail .gb",{scaleY:0,transformOrigin:"50% 100%",duration:.8,stagger:.05,delay:.3,ease:"power3.out"});
  }
}

/* ---- esercenti da confermare ---- */
function unknownMap(){
  const u={};for(const t of T())if(!categoria(t))u[t.n]=(u[t.n]||0)+t.i;return u;
}
function renderUnknown(){
  const u=unknownMap(),names=Object.keys(u);
  $("todo").hidden=!names.length;
  const box=$("unknown");box.textContent="";
  for(const n of names){
    const sel=h("select",{"aria-label":"Categoria per "+n},new Option("Scegli categoria…",""));
    for(const c of CATS)sel.add(new Option(c,c));

    box.append(h("div",{class:"q"},h("div",{class:"top"},h("span",{},h("b",{},n),aiSet.has(n)?h("span",{class:"tag"},"suggerito da Claude"):null),h("span",{class:"num"},eur(u[n]))),sel));
  }
}
$("save").onclick=async()=>{
  for(const[k,v]of Object.entries(pending))if(v)learned[k]=v;
  pending={};aiSet=new Set();await persistRules();render();
};

let navDir=0,navGo=null;
function animateIn(){
  if(!window.gsap||RM)return;
  const has=q=>document.querySelector(q);
  const tl=gsap.timeline({defaults:{ease:"power3.out"}});
  tl.from("#hero",{y:34,opacity:0,scale:.95,duration:.85},0);
  if(has("#brk .seg"))tl.fromTo("#brk .seg",{strokeDashoffset:100},{strokeDashoffset:0,duration:1.2,stagger:.09},.15);
  if(has("#stats .st"))tl.from("#stats .st",{y:26,opacity:0,scale:.94,duration:.6,stagger:.1},.2);
  if(has("#lnc .ln")){tl.fromTo("#lnc .ln",{strokeDashoffset:1},{strokeDashoffset:0,duration:1.4},.35);tl.from("#lnc .ar",{opacity:0,duration:1},.7)}
  if(has("#table .row"))tl.from("#table .row",{y:22,opacity:0,duration:.55,stagger:.07},.35);
  document.querySelectorAll("#table .amt,#stats .amt").forEach(e=>countUp(e,+e.dataset.v));
  if(has("#table .rbar i"))tl.from("#table .rbar i",{width:0,duration:1,stagger:.07},.5);
}
function intro(){
  if(!window.gsap||RM)return;
  gsap.from([".brand","#intro"],{y:28,opacity:0,duration:.8,stagger:.12,ease:"power3.out"});gsap.from("#drop",{opacity:0,duration:.8,delay:.25,ease:"power3.out"});
  gsap.to(".drop svg",{y:-4,duration:1.1,repeat:-1,yoyo:true,ease:"sine.inOut"});
  gsap.to(".o1",{x:-34,y:34,duration:7,repeat:-1,yoyo:true,ease:"sine.inOut"});
  gsap.to(".o2",{x:44,y:-24,duration:9,repeat:-1,yoyo:true,ease:"sine.inOut"});
  const io=new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting){io.unobserve(e.target);gsap.from(e.target,{y:40,opacity:0,duration:.85,ease:"power3.out"})}},{threshold:.12});
  document.querySelectorAll("#result h2,#table,#todo,#srch,#brk,#lnc,#stats").forEach(el=>io.observe(el));
}
let sx=0,sy=0;
$("hero").addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
$("hero").addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(navGo&&Math.abs(dx)>60&&Math.abs(dy)<40)navGo(dx<0?1:-1)},{passive:true});
$("scrim").onclick=()=>{if(formOpen)closeForm();else closeSheet()};
for(const c of CATS)$("mCat").add(new Option(c,c));
$("mOut").onclick=()=>setType(-1);$("mIn").onclick=()=>setType(1);
$("mSave").onclick=saveForm;$("mCancel").onclick=closeForm;$("addm0").onclick=openForm;
for(const c of [...CATS,"Da confermare"])$("fc").add(new Option(c,c));
for(const id of ["q","fmin"])$(id).addEventListener("input",renderTx);
for(const id of ["fc","fd1","fd2"])$(id).addEventListener("change",renderTx);
$("brk").addEventListener("click",e=>{const g=e.target.closest("[data-c]");if(g&&g.dataset.c!=="Da confermare"){open=g.dataset.c;render()}});
(async()=>{await initStore();await loadAll();for(const[k,t]of [...tx])if(t.s==="banca")tx.delete(k);render();intro()})();
