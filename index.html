<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#07081a">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dove Vanno</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<h1 class="brand"><svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="13" fill="#7c5cff"/><rect class="b1" x="10" y="11" width="20" height="4.5" rx="2.25" fill="#fff"/><rect class="b2" x="10" y="18" width="14" height="4.5" rx="2.25" fill="#fff"/><rect class="b3" x="10" y="25" width="8" height="4.5" rx="2.25" fill="#fff"/></svg>Dove Vanno</h1>
<div class="seg3" id="srcs" role="group" aria-label="Conto"></div>
<p class="mute" id="intro">Carico i tuoi dati…</p>
<label class="drop" id="drop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg><span>Aggiungi un export di Satispay (.xlsx)</span><input type="file" id="file" accept=".xlsx,.xls,.csv"></label>
<button id="addm0" class="ghost" type="button" style="margin-top:10px;width:100%">+ Aggiungi una spesa a mano</button>
<div class="ok" id="msg" hidden></div>
<div class="err" id="err" hidden></div>

<section id="result" hidden>
  <div class="seg3" id="seg3" role="group" aria-label="Tipo di periodo"></div>
  <div class="nav" id="nav"></div>
  <div class="card hero" id="hero"><i class="orb o1"></i><i class="orb o2"></i><div class="hin" id="heroIn"></div></div>
  <div class="stats" id="stats"></div>
  <div class="card glow" id="brk" style="margin-top:12px"></div>
  <h2 id="lnT">Andamento nel mese</h2><div class="card" id="lnc"></div>
  <h2>Per categoria</h2>
  <p class="mute">Tocca una categoria per vedere i singoli pagamenti.</p>
  <div class="card" id="table"></div>
  <h2>Pagamenti</h2>
  <div class="card" id="srch">
    <input id="q" type="search" placeholder="Cerca un pagamento…" aria-label="Cerca">
    <div class="fgrid"><select id="fc" class="w2" aria-label="Categoria"><option value="">Tutte le categorie</option></select><input id="fmin" class="w2" type="number" inputmode="decimal" placeholder="Importo minimo €" aria-label="Importo minimo"><label class="fl">Dal<input id="fd1" type="date"></label><label class="fl">Al<input id="fd2" type="date"></label></div>
    <div class="mute" id="fsum"></div><div id="flist"></div>
  </div>
  <section id="detail" hidden></section>
  <section id="todo" hidden>
    <h2>Esercenti da confermare</h2>
    <p class="mute">Non li conosco ancora. Scegli la categoria: una volta confermata, la ricordo per i prossimi mesi.</p>
    <div class="card" id="unknown"></div>
    <div class="actions">
      <button id="save" type="button">Conferma scelte</button>
    </div>
  </section>
</section>
</main>

<div id="scrim" hidden></div>
<div id="mform" hidden role="dialog" aria-label="Nuova spesa">
  <div class="grab"></div>
  <h2 style="margin:6px auto 12px">Nuova spesa</h2>
  <div class="seg2"><button type="button" id="mOut" class="chip on">Uscita</button><button type="button" id="mIn" class="chip">Entrata</button></div>
  <label class="fl">Importo (€)<input id="mAmt" type="text" inputmode="decimal" autocomplete="off" placeholder="0,00"></label>
  <label class="fl">Descrizione<input id="mName" type="text" placeholder="Es. Pizzeria"></label>
  <label class="fl">Conto<select id="mSrc"><option value="contanti">Contanti</option><option value="satispay">Satispay</option></select></label>
  <label class="fl">Categoria<select id="mCat"></select></label>
  <label class="fl">Data<input id="mDate" type="date"></label>
  <div class="err" id="mErr" hidden></div>
  <div class="actions"><button id="mSave" type="button">Salva</button><button id="mCancel" class="ghost" type="button">Annulla</button></div>
</div>
<script src="script.js"></script>
</body>
</html>
